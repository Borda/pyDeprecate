default_language_version:
  # generic python3 so hooks run under the local interpreter; docformatter keeps its own
  # python3.10 pin below (wheel/compat workaround) until a release supports 3.12+
  python: python3

ci:
  autofix_prs: true
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit suggestions"
  autoupdate_schedule: quarterly
  # submodules: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb 250"]
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 9337a74165b178ae2c766f60bee7252a0f06f3e8 # v3.9.5
    hooks:
      - id: prettier
        files: \.(html|yml|yaml|toml)
        exclude: ^docs/overrides/.*\.html$
        # https://prettier.io/docs/en/options.html#print-width
        args: ["--print-width=120"]

  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        #args: ["--write-changes"] # uncomment if you want to get automatic fixing

  - repo: https://github.com/PyCQA/docformatter
    rev: 0032269a0e65c068af9cd86c9a8859a0ddd568d6 # v1.7.8
    hooks:
      - id: docformatter
        # python3.10: wheel/compat issue prevents running the hook under 3.12+; revisit after next rev bump
        # TODO: remove language_version pin after new docformatter release with python 3.14 support
        language_version: python3.10
        additional_dependencies: [tomli]
        args: ["--in-place"]
        # tests/ excluded: docformatter misattributes the blank line after a nested def/class
        # with a one-liner docstring as being inside the function body (D202 scope bug),
        # causing a deadlock with ruff-format which requires that blank line (E301).
        # Tracked: https://github.com/PyCQA/docformatter/issues/354
        exclude: ^tests/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: d2823d321df3af8f878f7ee3414dc94d037145b9 # v2.1.0
    hooks:
      - id: mypy
        name: typing
        language_version: python3.10
        exclude: ^demo-.* # exclude demo doc folders

  - repo: https://github.com/executablebooks/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547 # 1.0.0
    hooks:
      - id: mdformat
        name: mdformat (general)
        exclude: ^docs/
        args: ["--number"]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-ruff
          - mdformat_frontmatter
      - id: mdformat
        name: mdformat (docs)
        files: ^docs/
        exclude: ^docs/llms\.txt$ # agent-facing plain-text contract — must stay compact, not table-padded
        args: ["--number", "--wrap=no"]
        additional_dependencies:
          - mdformat-mkdocs
          - mdformat-ruff
          - mdformat_frontmatter

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c59bba8fb259db0fec2bbb77ad8ba51ea7341b56 # v0.15.20
    hooks:
      # try to fix what is possible
      - id: ruff-check
        args: ["--fix"] #, "--unsafe-fixes"
      # perform formatting updates
      - id: ruff-format

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 0c8c15d8fe996493035be407c5cf4a288cf6bf8e # v2.25.1
    hooks:
      - id: pyproject-fmt
        additional_dependencies: [tox]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 4b2e70d08cb2ccd26d1fba73588de41c7a5d50b7 # v0.25
    hooks:
      - id: validate-pyproject
