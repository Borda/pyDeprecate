name: CI action

# Real-case check of the repository-root `action.yml`: runs the action the way a caller does (`uses: ./`), including
# the pip install from the action checkout, on every OS and on the oldest and newest supported Python.
on: # Trigger the workflow on push or pull request, but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# cancel superseded runs only on PRs; never cancel pushes to protected branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  action-run:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.14"]
    timeout-minutes: 10
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ✅ Clean package passes (installs from the action ref, writes the job summary)
        uses: ./
        with:
          path: src/deprecate
          summary: true

      - name: ✅ Policy gate passes on the already-installed package
        uses: ./
        with:
          subcommand: policy
          path: src/deprecate
          install: false

      # Expected failure, asserted inside the step so the step itself passes: a `uses:` step cannot invert its own
      # outcome, and `continue-on-error` still marks it failed. This runs `action_runner.py` (the file `action.yml`
      # executes) with the same inputs and requires exit code 1 plus an ::error annotation. The captured output is
      # printed only on a mismatch, so the expected ::error line does not surface as an annotation on a green run.
      # The exit-zero step below reruns the same inputs through `uses: ./`; the cause is pinned by
      # test_misconfigured_package_fails_with_annotation in tests/integration/test_action.py.
      - name: ✅ Misconfigured wrappers fail the gate (exit 1 expected)
        shell: bash
        env:
          PYDEPRECATE_ACTION_SUBCOMMAND: check
          PYDEPRECATE_ACTION_PATH: tests.collections.misconfigured
          PYDEPRECATE_ACTION_INSTALL: "false"
        run: |
          log="$(mktemp)"
          code=0
          python .github/scripts/action_runner.py >"$log" 2>&1 || code=$?
          if [ "$code" -ne 1 ] || ! grep -q '^::error ' "$log"; then
            cat "$log"
            echo "::error::expected exit code 1 and an ::error annotation from the misconfigured scan, got exit code $code"
            exit 1
          fi
          echo "misconfigured scan failed as expected (exit code 1, ::error annotation raised)"

      - name: ✅ exit-zero reports the same findings without failing
        uses: ./
        with:
          subcommand: check
          path: tests.collections.misconfigured
          exit-zero: true
          install: false

  action-guardian:
    runs-on: ubuntu-latest
    needs: action-run
    if: always()
    steps:
      - run: echo "${{ needs.action-run.result }}"
      - name: ❌ Failing...
        if: needs.action-run.result == 'failure'
        run: exit 1
      - name: ⏭️ Cancelled or skipped...
        if: contains(fromJSON('["cancelled", "skipped"]'), needs.action-run.result)
        timeout-minutes: 1
        run: sleep 90
