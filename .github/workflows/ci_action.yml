name: CI action

# Real-case check of the repository-root `action.yml`: runs the action the way a caller does (`uses: ./`), including
# the pip install from the action checkout, on every OS and on the oldest and newest supported Python.
on: # Trigger the workflow on push or pull request, but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# cancel superseded runs only on PRs; never cancel pushes to protected branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  action-run:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.14"]
    timeout-minutes: 10
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ✅ Clean package passes (installs from the action ref, writes the job summary)
        uses: ./
        with:
          path: src/deprecate
          summary: true

      - name: ✅ Policy gate passes on the already-installed package
        uses: ./
        with:
          subcommand: policy
          path: src/deprecate
          install: false

      # Expected failure. This step only proves the action fails on misconfigured wrappers; it does not
      # inspect why. The cause (exit code 1 plus the ::error annotation naming the misconfigured argument) is
      # pinned by the pytest test test_misconfigured_package_fails_with_annotation in
      # tests/integration/test_action.py, and by the exit-zero step below, which reruns the same inputs and must pass.
      - name: ❌ Misconfigured wrappers fail the step
        id: misconfigured
        continue-on-error: true
        uses: ./
        with:
          subcommand: check
          path: tests.collection_misconfigured
          install: false

      - name: 🔍 Expect the previous step to have failed
        if: steps.misconfigured.outcome != 'failure'
        shell: bash
        run: |
          echo "expected the misconfigured scan to fail, got: ${{ steps.misconfigured.outcome }}"
          exit 1

      - name: ✅ exit-zero reports the same findings without failing
        uses: ./
        with:
          subcommand: check
          path: tests.collection_misconfigured
          exit-zero: true
          install: false

  action-guardian:
    runs-on: ubuntu-latest
    needs: action-run
    if: always()
    steps:
      - run: echo "${{ needs.action-run.result }}"
      - name: ❌ Failing...
        if: needs.action-run.result == 'failure'
        run: exit 1
      - name: ⏭️ Cancelled or skipped...
        if: contains(fromJSON('["cancelled", "skipped"]'), needs.action-run.result)
        timeout-minutes: 1
        run: sleep 90
