name: Package Release

# https://help.github.com/en/actions/reference/events-that-trigger-workflows
on: # Trigger the workflow on push or pull request for the main branch, tag push, or release published
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_create-pkg.yml
    with:
      python-version: "3.10"
      artifact-name: pypi-packages-${{ github.sha }}

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      actions: read # required for actions/download-artifact
      id-token: write # required for OIDC Trusted Publishing
    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pypi-packages-${{ github.sha }}
          path: dist
      - name: 📋 Show packages
        run: ls -lh dist/

      #- name: 🚀 Publish to Test PyPI
      #  uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      #  with:
      #    repository-url: https://test.pypi.org/legacy/

      - name: 🚀 Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release-upload:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # required for actions/download-artifact
      contents: write # required for uploading release assets
    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pypi-packages-${{ github.sha }}
          path: dist
      - name: 📋 Show packages
        run: ls -lh dist/

      - name: 📤 Upload to release
        uses: AButler/upload-release-assets@3d6774fae0ed91407dc5ae29d576b166536d1777 # v3.0
        with:
          files: "dist/*"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          release-id: ${{ github.event.release.id }}
          release-tag: ${{ github.ref_name }}
