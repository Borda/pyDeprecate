name: Pre-commit

# Runs every hook in .pre-commit-config.yaml on the whole tree, so the local hooks that pre-commit.ci cannot run
# (generated files, repo-specific checks) are covered too.
# see: https://help.github.com/en/actions/reference/events-that-trigger-workflows
on: # Trigger the workflow on push or pull request, but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# cancel superseded runs only on PRs; never cancel pushes to protected branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: 🐍 Set up Python
        # 3.11 is the interpreter the docformatter and mypy hooks pin in .pre-commit-config.yaml
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: 📦 Install pre-commit
        run: pip install pre-commit
      - name: ♻️ Cache hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: 🔎 Run all hooks
        # --show-diff-on-failure prints what an auto-fixing hook (mdformat, ruff-format, prettier) would change
        run: pre-commit run --all-files --show-diff-on-failure --color always
