name: Check links & references

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run once a week on Sundays
    - cron: "0 9 * * 0"

permissions:
  contents: read

# cancel superseded runs only on PRs; never cancel pushes to protected branches or scheduled runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links-check:
    runs-on: ubuntu-latest
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Cache lychee results
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            cache-lychee-${{ github.event.pull_request.number }}-
            cache-lychee-

      - name: 🔗 Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # default args: "--verbose --no-progress './**/*.md' './**/*.html' './**/*.rst'"
          # TODO: drop exclude for stable docs after the next release
          args: |
            --verbose
            --no-progress
            --cache
            --max-cache-age 1d
            --accept '100..=103,200..=299,408,429'
            --cache-exclude-status 429
            './**/*.md'
            './**/*.rst'
            './**/*.py'
            './**/*.yml'
            './**/*.yaml'
            './**/*.toml'
            --include-verbatim
            --exclude https://github.com/YOUR-USERNAME/pyDeprecate.git
            --exclude https://codecov.io/validate
            --exclude https://medium.com/codex/mastering-api-deprecation-*
            --exclude http://127.0.0.1
            --exclude file://.*demo-sphinx.*
            --exclude file://.*demo-mkdocs.*
            --exclude '^https[:]//borda[/]$'
            --exclude '^[hH]ttps://github\.com/\$(\.git)?$'
          fail: true
