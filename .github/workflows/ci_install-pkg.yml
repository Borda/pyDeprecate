name: Install pkg

# see: https://help.github.com/en/actions/reference/events-that-trigger-workflows
on: # Trigger the workflow on push or pull request, but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# cancel superseded runs only on PRs; never cancel pushes to protected branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  pkg-check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"]
      fail-fast: false
    uses: ./.github/workflows/_create-pkg.yml
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
      artifact-name: ci-packages-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.sha }}

  pkg-install:
    needs: pkg-check
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: 🐍 Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: 📥 Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-packages-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.sha }}
          path: dist
      - name: 📋 Show packages
        working-directory: dist
        run: |
          ls
          pip -V
          echo "PKG_WHEEL=$(ls *.whl | head -n1)" >> $GITHUB_ENV
          echo "PKG_SOURCE=$(ls *.tar.gz | head -n1)" >> $GITHUB_ENV
          pip list

      - name: 📦 Install and check package (wheel)
        working-directory: dist
        run: |
          pip install '${{ env.PKG_WHEEL }}' --force-reinstall
          pip list
          python -c "import deprecate as pkg; print(f'version: {pkg.__version__}')"

      - name: 🖥️ Smoke-test console script (cli extra)
        working-directory: dist
        run: |
          pip install "${{ env.PKG_WHEEL }}[audit,cli]" --force-reinstall
          pydeprecate --help

      - name: 🐶 Dogfood — audit our own deprecations
        # `policy` reads `[tool.pydeprecate.policy]` from this repo's pyproject.toml and is the gate; `all` is advisory.
        run: |
          pydeprecate all src/deprecate
          pydeprecate policy src/deprecate

      - name: 📦 Install and check package (sdist)
        working-directory: dist
        run: |
          pip install '${{ env.PKG_SOURCE }}' --force-reinstall
          pip list
          python -c "import deprecate as pkg; print(f'version: {pkg.__version__}')"

  install-guardian:
    runs-on: ubuntu-latest
    needs: pkg-install
    if: always()
    steps:
      - run: echo "${{ needs.pkg-install.result }}"
      - name: ❌ Failing...
        if: needs.pkg-install.result == 'failure'
        run: exit 1
      - name: ⏭️ Cancelled or skipped...
        if: contains(fromJSON('["cancelled", "skipped"]'), needs.pkg-install.result)
        timeout-minutes: 1
        run: sleep 90
