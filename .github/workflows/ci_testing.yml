name: CI testing

# see: https://help.github.com/en/actions/reference/events-that-trigger-workflows
on: # Trigger the workflow on push or pull request, but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# cancel superseded runs only on PRs; never cancel pushes to protected branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytester:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # py3.9/3.10 stay on the image before `-latest`: actions/python-versions ships no Ubuntu 26.04 build of 3.9 and no
        # Windows or arm64 macOS installer newer than 3.9.13 / 3.10.11
        include:
          - { os: ubuntu-22.04, python-version: "3.9" }
          - { os: macos-15, python-version: "3.9" }
          - { os: windows-2022, python-version: "3.9" }
          - { os: ubuntu-22.04, python-version: "3.10" }
          - { os: macos-15, python-version: "3.10" }
          - { os: windows-2022, python-version: "3.10" }
    # Timeout: https://stackoverflow.com/a/59076067/4521646
    timeout-minutes: 15
    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install requirements
        run: |
          pip install ".[audit,cli]" -r tests/requirements.txt
          pip list
        shell: bash

      - name: 🧪 Tests
        shell: bash
        run: |
          python -m phmdoctest README.md -s "phmdoctest:skip" --outfile tests/integration/test_readme.py
          for md in $(find docs -name "*.md" -not -path "*/_*" | sort); do
            name="${md#docs/}"; name="${name%.md}"; name="${name//\//_}"; name="${name//-/_}"; \
            python -m phmdoctest "$md" -s "phmdoctest:skip" --outfile "tests/docs/test_${name}.py"; \
          done
          # tests marked `without_coverage` (see pyproject.toml) cannot run under subprocess coverage: separate invocation
          python -m pytest . --cov=deprecate -m "not without_coverage"
          python -m pytest . -m without_coverage

      - name: 📊 Statistics
        if: success()
        run: |
          coverage report
          coverage xml

      - name: 📡 Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success()
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: pytest,python${{ matrix.python-version }}
          fail_ci_if_error: false

  testing-guardian:
    runs-on: ubuntu-latest
    needs: pytester
    if: always()
    steps:
      - run: echo "${{ needs.pytester.result }}"
      - name: ❌ Failing...
        if: needs.pytester.result == 'failure'
        run: exit 1
      - name: ⏭️ Cancelled or skipped...
        if: contains(fromJSON('["cancelled", "skipped"]'), needs.pytester.result)
        timeout-minutes: 1
        run: sleep 90
