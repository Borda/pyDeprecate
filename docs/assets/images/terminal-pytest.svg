<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 338" width="960" height="338" role="img" aria-labelledby="t d">
  <title id="t">pytest fails on an expired deprecation</title>
  <desc id="d">Terminal: a pytest test built on validate_deprecation_expiry fails because billing.calc_total outlived its removal version 1.4 in release 1.5. Output abridged.</desc>
  <style>text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }</style>
  <rect width="960" height="338" rx="14" fill="#141B26" stroke="#2E3B50" stroke-width="1.5"/>
  <circle cx="26" cy="24" r="5" fill="#E8735A"/><circle cx="44" cy="24" r="5" fill="#EAA238"/><circle cx="62" cy="24" r="5" fill="#6FCF97"/>
  <text x="934" y="28" text-anchor="end" fill="#9FB0C6" font-size="11">terminal · output abridged</text>
  <line x1="0" y1="42" x2="960" y2="42" stroke="#2E3B50" stroke-width="1"/>
  <text x="24" y="62" xml:space="preserve"><tspan fill="#6FCF97">$ </tspan><tspan fill="#E6EDF7">pytest test_expiry.py</tspan></text>
  <text x="24" y="83" xml:space="preserve"><tspan fill="#9FB0C6">collected 1 item</tspan></text>
  <text x="24" y="104" xml:space="preserve"><tspan fill="#E6EDF7">test_expiry.py </tspan><tspan fill="#E8735A">F</tspan><tspan fill="#9FB0C6">                                                        [100%]</tspan></text>
  <text x="24" y="125" xml:space="preserve"><tspan fill="#E8735A">_________________________ test_no_zombie_deprecations __________________________</tspan></text>
  <text x="24" y="146" xml:space="preserve"><tspan fill="#E6EDF7">    current_version = </tspan><tspan fill="#6FCF97">&quot;1.5&quot;</tspan></text>
  <text x="24" y="167" xml:space="preserve"><tspan fill="#E6EDF7">    expired = validate_deprecation_expiry(billing, current_version)</tspan></text>
  <text x="24" y="188" xml:space="preserve"><tspan fill="#E6EDF7">    </tspan><tspan fill="#C792EA">if</tspan><tspan fill="#E6EDF7"> expired:</tspan></text>
  <text x="24" y="209" xml:space="preserve"><tspan fill="#E8735A">&gt;           pytest.fail(&quot;Found expired deprecated code:\n&quot; + &quot;\n&quot;.join(expired))</tspan></text>
  <text x="24" y="230" xml:space="preserve"><tspan fill="#E8735A">E           Failed: Found expired deprecated code:</tspan></text>
  <text x="24" y="251" xml:space="preserve"><tspan fill="#E8735A">E           Callable `billing.calc_total` was scheduled for removal in version 1.4 but … </tspan></text>
  <text x="24" y="272" xml:space="preserve"><tspan fill="#E8735A">FAILED test_expiry.py::test_no_zombie_deprecations - Failed: Found expired de...</tspan></text>
  <text x="24" y="293" xml:space="preserve"><tspan fill="#E8735A">============================== 1 failed in 0.02s ==============================</tspan></text>
</svg>
