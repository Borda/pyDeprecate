<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d">
  <title id="t">Selective attribute deprecation</title>
  <desc id="d">A deprecated_class proxy with attrs_mapping handles three kinds of attribute access: a mapped rename warns and redirects to the canonical name, an unlisted attribute passes through silently, and a mapping to None warns without renaming.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7F99"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6FCF97"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E8735A"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EAA238"/></marker>
  </defs>
  <rect width="960" height="450" rx="18" fill="#1B2330"/>
  <text x="40" y="44" font-size="22" fill="#F7F9FC" font-weight="700">Deprecate only some attributes</text>
  <text x="920" y="44" font-size="13" fill="#EAA238" text-anchor="end" class="mono">deprecated_class(attrs_mapping=…)</text>
  <rect x="40" y="72" width="880" height="70" rx="12" fill="#141B26" stroke="#2E3B50" stroke-width="1.5"/>
  <text x="60" y="96" font-size="13" fill="#E6EDF7" class="mono">@deprecated_class(attrs_mapping={&quot;color&quot;: &quot;colour&quot;, &quot;shade&quot;: None},</text>
  <text x="250" y="118" font-size="13" fill="#E6EDF7" class="mono">deprecated_in=&quot;2.0&quot;, remove_in=&quot;3.0&quot;)</text>
  <text x="900" y="118" font-size="13" fill="#9FB0C6" text-anchor="end" class="mono">class Palette</text>
  <text x="70" y="176" font-size="11" fill="#9FB0C6" letter-spacing="2">CALLER READS</text>
  <text x="430" y="176" font-size="11" fill="#9FB0C6" letter-spacing="2">PROXY DOES</text>
  <text x="700" y="176" font-size="11" fill="#9FB0C6" letter-spacing="2">CALLER GETS</text>
  <rect x="40" y="196" width="880" height="56" rx="12" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <rect x="60" y="206" width="190" height="36" rx="8" fill="#263246" stroke="#3A4A60" stroke-width="1.5"/>
  <text x="155" y="229" font-size="13" fill="#F7F9FC" text-anchor="middle" class="mono">Palette.color</text>
  <line x1="256" y1="224" x2="400" y2="224" stroke="#EAA238" stroke-width="2.2" marker-end="url(#aha)"/>
  <rect x="410" y="206" width="190" height="36" rx="18" fill="#141B26" stroke="#EAA238" stroke-width="1.6"/>
  <text x="505" y="229" font-size="12" fill="#EAA238" text-anchor="middle" font-weight="600">warns, then redirects</text>
  <line x1="606" y1="224" x2="690" y2="224" stroke="#EAA238" stroke-width="2.2" marker-end="url(#aha)"/>
  <rect x="700" y="206" width="200" height="36" rx="8" fill="#263246" stroke="#3A4A60" stroke-width="1.5"/>
  <text x="800" y="229" font-size="13" fill="#F7F9FC" text-anchor="middle" class="mono">Palette.colour</text>
  <rect x="40" y="268" width="880" height="56" rx="12" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <rect x="60" y="278" width="190" height="36" rx="8" fill="#263246" stroke="#3A4A60" stroke-width="1.5"/>
  <text x="155" y="301" font-size="13" fill="#F7F9FC" text-anchor="middle" class="mono">Palette.shade</text>
  <line x1="256" y1="296" x2="400" y2="296" stroke="#EAA238" stroke-width="2.2" marker-end="url(#aha)"/>
  <rect x="410" y="278" width="190" height="36" rx="18" fill="#141B26" stroke="#EAA238" stroke-width="1.6"/>
  <text x="505" y="301" font-size="12" fill="#EAA238" text-anchor="middle" font-weight="600">warns, no rename</text>
  <line x1="606" y1="296" x2="690" y2="296" stroke="#EAA238" stroke-width="2.2" marker-end="url(#aha)"/>
  <rect x="700" y="278" width="200" height="36" rx="8" fill="#263246" stroke="#3A4A60" stroke-width="1.5"/>
  <text x="800" y="301" font-size="13" fill="#F7F9FC" text-anchor="middle" class="mono">Palette.shade</text>
  <rect x="40" y="340" width="880" height="56" rx="12" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <rect x="60" y="350" width="190" height="36" rx="8" fill="#263246" stroke="#3A4A60" stroke-width="1.5"/>
  <text x="155" y="373" font-size="13" fill="#F7F9FC" text-anchor="middle" class="mono">Palette.size</text>
  <line x1="256" y1="368" x2="400" y2="368" stroke="#6FCF97" stroke-width="2.2" marker-end="url(#ahg)"/>
  <rect x="410" y="350" width="190" height="36" rx="18" fill="#141B26" stroke="#6FCF97" stroke-width="1.6"/>
  <text x="505" y="373" font-size="12" fill="#6FCF97" text-anchor="middle" font-weight="600">silent passthrough</text>
  <line x1="606" y1="368" x2="690" y2="368" stroke="#6FCF97" stroke-width="2.2" marker-end="url(#ahg)"/>
  <rect x="700" y="350" width="200" height="36" rx="8" fill="#263246" stroke="#3A4A60" stroke-width="1.5"/>
  <text x="800" y="373" font-size="13" fill="#F7F9FC" text-anchor="middle" class="mono">Palette.size</text>
  <text x="40" y="432" font-size="12" fill="#9FB0C6">Keys are the names callers use today. Reads, writes and deletes of a mapped key behave the same way.</text>
</svg>
