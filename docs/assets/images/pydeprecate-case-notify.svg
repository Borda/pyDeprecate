<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="t d">
  <title id="t">pyDeprecate: warn only</title>
  <desc id="d">Code builds up in four steps: the original legacy_hook, a note that no replacement exists, the @deprecated decorator with TargetMode.NOTIFY, then a call that warns and still runs the original body.</desc>
