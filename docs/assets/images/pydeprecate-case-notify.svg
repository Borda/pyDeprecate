  <rect x="490" y="80" width="215" height="30" rx="15" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <rect class="g3" x="490" y="80" width="215" height="30" rx="15" fill="#3A2B10" stroke="#EAA238" stroke-width="2"/>
  <text x="597.5" y="100" font-size="13" font-weight="600" text-anchor="middle" fill="#F7F9FC">③ Add @deprecated</text>
  <rect x="715" y="80" width="215" height="30" rx="15" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <rect class="g4" x="715" y="80" width="215" height="30" rx="15" fill="#3A2B10" stroke="#EAA238" stroke-width="2"/>
  <text x="822.5" y="100" font-size="13" font-weight="600" text-anchor="middle" fill="#F7F9FC">④ Call the old API</text>
  <rect x="40" y="124" width="500" height="280" rx="14" fill="#141B26" stroke="#2E3B50" stroke-width="1.5"/>
  <circle cx="62" cy="140" r="4.5" fill="#E8735A"/>
  <circle cx="78" cy="140" r="4.5" fill="#EAA238"/>
  <circle cx="94" cy="140" r="4.5" fill="#6FCF97"/>
  <text x="520" y="144" font-size="11" text-anchor="end" class="dim mono">hooks.py</text>
  <rect class="hl g1" x="48" y="294" width="484" height="44" rx="6" fill="#EAA238" fill-opacity=".14"/>
  <rect class="hl g2" x="48" y="162" width="484" height="22" rx="6" fill="#EAA238" fill-opacity=".14"/>
  <rect class="hl g3" x="48" y="184" width="484" height="110" rx="6" fill="#EAA238" fill-opacity=".14"/>
  <text class="ln mono k0" xml:space="preserve" x="64" y="178" font-size="13" fill="#E6EDF7" textLength="382.2" lengthAdjust="spacing"><tspan fill="#6B7F99" font-style="italic"># no new API: keep the body, announce the removal</tspan></text>
  <text class="ln mono k1" xml:space="preserve" x="64" y="200" font-size="13" fill="#E6EDF7" textLength="93.6" lengthAdjust="spacing"><tspan fill="#EAA238">@deprecated</tspan>(</text>
  <text class="ln mono k2" xml:space="preserve" x="64" y="222" font-size="13" fill="#E6EDF7" textLength="226.2" lengthAdjust="spacing">    target=TargetMode.NOTIFY,</text>
  <text class="ln mono k3" xml:space="preserve" x="64" y="244" font-size="13" fill="#E6EDF7" textLength="187.2" lengthAdjust="spacing">    deprecated_in=<tspan fill="#A5D6A7">"1.2"</tspan>,</text>
  <text class="ln mono k4" xml:space="preserve" x="64" y="266" font-size="13" fill="#E6EDF7" textLength="156.0" lengthAdjust="spacing">    remove_in=<tspan fill="#A5D6A7">"2.0"</tspan>,</text>
  <text class="ln mono k5" xml:space="preserve" x="64" y="288" font-size="13" fill="#E6EDF7" textLength="7.8" lengthAdjust="spacing">)</text>
  <text class="ln mono k6" xml:space="preserve" x="64" y="310" font-size="13" fill="#E6EDF7" textLength="202.8" lengthAdjust="spacing"><tspan fill="#C792EA">def</tspan> legacy_hook() -&gt; <tspan fill="#C792EA">None</tspan>:</text>
  <text class="ln mono k7" xml:space="preserve" x="64" y="332" font-size="13" fill="#E6EDF7" textLength="187.2" lengthAdjust="spacing">    <tspan fill="#C792EA">print</tspan>(<tspan fill="#A5D6A7">"legacy work"</tspan>)</text>
  <g class="ex ph1">
    <rect x="48" y="184" width="484" height="22" rx="6" fill="#7FB6E3" fill-opacity=".2"/>
