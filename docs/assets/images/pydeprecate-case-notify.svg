    <rect x="48" y="294" width="484" height="22" rx="6" fill="#7FB6E3" fill-opacity=".2"/>
    <text x="52" y="309" font-size="10" fill="#7FB6E3">▶</text>
    <rect x="48" y="316" width="484" height="22" rx="6" fill="#7FB6E3" fill-opacity=".2"/>
    <text x="52" y="331" font-size="10" fill="#7FB6E3">▶</text>
    <rect x="139.0" y="318" width="107.4" height="19" rx="4" fill="#6FCF97" fill-opacity=".14" stroke="#6FCF97" stroke-width="1.8"/>
  </g>
  <text class="legend" x="520" y="396" font-size="10" text-anchor="end" fill="#9FB0C6" xml:space="preserve"><tspan fill="#7FB6E3">▶</tspan> running    <tspan fill="#6FCF97">▢</tspan> argument used</text>
  <rect x="560" y="124" width="360" height="280" rx="14" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <text x="580" y="147" font-size="11" letter-spacing="2" class="dim">AT RUNTIME</text>
  <g class="nodes">
    <rect x="600" y="168" width="170" height="46" rx="9" class="box"/>
    <rect x="600" y="252" width="170" height="46" rx="9" class="box" stroke="#EAA238"/>
    <rect x="600" y="336" width="170" height="46" rx="9" class="box"/>
    <text class="mono" x="685" y="189" font-size="12" text-anchor="middle" fill="#F7F9FC">legacy_hook()</text>
    <text x="685" y="205" font-size="10" text-anchor="middle" class="dim">caller · user code</text>
    <text class="mono" x="685" y="273" font-size="11.5" font-weight="700" text-anchor="middle" fill="#EAA238">@deprecated</text>
    <text class="mono dim" x="685" y="289" font-size="10" text-anchor="middle">NOTIFY · warn only</text>
    <text class="mono" x="685" y="357" font-size="12" text-anchor="middle" fill="#F7F9FC">legacy_hook()</text>
