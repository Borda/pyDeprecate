    <text class="mono" x="792" y="288" font-size="9.5" fill="#F5D9A6">removed in v2.0</text>
    <text class="mono" x="792" y="302" font-size="9.5" fill="#F5D9A6">(no replacement)</text>
  </g>
  <text class="res mono" x="782" y="363" font-size="12" fill="#6FCF97">→ None</text>
  <circle class="pk pk1" cx="685" cy="216" r="6" fill="#E8735A"/>
  <circle class="pk pk2" cx="685" cy="300" r="6" fill="#7FB6E3"/>
  <circle class="pk pk3" cx="580" cy="359" r="6" fill="#6FCF97"/>
  <rect x="40" y="420" width="880" height="48" rx="12" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <text class="cap cap1" x="480" y="450" font-size="14" text-anchor="middle" fill="#F7F9FC">Start: legacy_hook() works but is going away.</text>
  <text class="cap cap2" x="480" y="450" font-size="14" text-anchor="middle" fill="#F7F9FC">No replacement exists: keep the body and only announce the removal.</text>
  <text class="cap cap3" x="480" y="450" font-size="14" text-anchor="middle" fill="#F7F9FC">Add @deprecated with target=TargetMode.NOTIFY.</text>
  <text class="cap cap4" x="480" y="450" font-size="14" text-anchor="middle" fill="#F7F9FC">Call legacy_hook(): it warns, then the original body runs unchanged.</text>
