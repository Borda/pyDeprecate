<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" width="960" height="312" role="img" aria-labelledby="t d">
  <title id="t">Weekly deprecations-due issue</title>
  <desc id="d">A scheduled workflow runs every Monday, installs the package with the audit extra, and runs pydeprecate expiry with the next release version. Exit 0 means nothing is due and no issue is touched. Exit 1 means wrappers are due and the tracking issue is created or updated. Exit 2 or 3 is an error and the job fails visibly.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .hl { animation: hl 13s ease-in-out infinite; opacity: 0; }
    @keyframes hl { 0% { opacity: 0 } 4% { opacity: 1 } 16% { opacity: 1 } 20%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .hl { animation: none !important; opacity: 0 !important; } }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7F99"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6FCF97"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E8735A"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EAA238"/></marker>
  </defs>
  <rect width="960" height="312" rx="18" fill="#1B2330"/>
  <text x="40" y="44" font-size="22" fill="#F7F9FC" font-weight="700">Weekly deprecations-due issue</text>
  <text x="920" y="44" font-size="13" fill="#EAA238" text-anchor="end">cron + pydeprecate expiry + one issue</text>
  <rect x="40" y="118" width="150" height="72" rx="12" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <text x="115.0" y="146" font-size="14" fill="#F7F9FC" text-anchor="middle" font-weight="700">Schedule</text>
  <text x="115.0" y="170" font-size="11" fill="#9FB0C6" text-anchor="middle">Mondays 07:00 UTC</text>
  <rect class="hl" style="animation-delay:-13.0s" x="40" y="118" width="150" height="72" rx="12" fill="none" stroke="#EAA238" stroke-width="3"/>
  <rect x="240" y="118" width="170" height="72" rx="12" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <text x="325.0" y="146" font-size="14" fill="#F7F9FC" text-anchor="middle" font-weight="700">Install</text>
  <text x="325.0" y="170" font-size="11" fill="#9FB0C6" text-anchor="middle">package + pyDeprecate[audit]</text>
  <rect class="hl" style="animation-delay:-11.0s" x="240" y="118" width="170" height="72" rx="12" fill="none" stroke="#EAA238" stroke-width="3"/>
  <rect x="460" y="118" width="240" height="72" rx="12" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <text x="580.0" y="146" font-size="14" fill="#F7F9FC" text-anchor="middle" font-weight="700">Run the check</text>
  <text x="580.0" y="165" font-size="11" fill="#EAA238" text-anchor="middle" class="mono" font-weight="600">pydeprecate expiry</text>
  <text x="580.0" y="181" font-size="11" fill="#EAA238" text-anchor="middle" class="mono" font-weight="600">--version $NEXT_RELEASE</text>
  <rect class="hl" style="animation-delay:-9.0s" x="460" y="118" width="240" height="72" rx="12" fill="none" stroke="#EAA238" stroke-width="3"/>
  <line x1="194" y1="154" x2="236" y2="154" stroke="#6B7F99" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="414" y1="154" x2="456" y2="154" stroke="#6B7F99" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="700" y1="154" x2="724" y2="154" stroke="#6B7F99" stroke-width="2"/>
  <line x1="724" y1="100" x2="724" y2="208" stroke="#6B7F99" stroke-width="2"/>
  <line x1="724" y1="100" x2="746" y2="100" stroke="#6FCF97" stroke-width="2" marker-end="url(#ahg)"/>
  <rect x="750" y="76" width="170" height="48" rx="10" fill="#141B26" stroke="#6FCF97" stroke-width="1.6"/>
  <text x="835" y="96" font-size="11.5" fill="#6FCF97" text-anchor="middle" font-weight="700">Exit 0 · nothing due</text>
  <text x="835" y="114" font-size="10.5" fill="#9FB0C6" text-anchor="middle">no issue is touched</text>
  <rect class="hl" style="animation-delay:-6.7s" x="750" y="76" width="170" height="48" rx="10" fill="none" stroke="#6FCF97" stroke-width="3.5"/>
  <line x1="724" y1="154" x2="746" y2="154" stroke="#EAA238" stroke-width="2" marker-end="url(#aha)"/>
  <rect x="750" y="130" width="170" height="48" rx="10" fill="#141B26" stroke="#EAA238" stroke-width="1.6"/>
  <text x="835" y="150" font-size="11.5" fill="#EAA238" text-anchor="middle" font-weight="700">Exit 1 · wrappers due</text>
  <text x="835" y="168" font-size="10.5" fill="#9FB0C6" text-anchor="middle">create or update the issue</text>
  <rect class="hl" style="animation-delay:-4.6s" x="750" y="130" width="170" height="48" rx="10" fill="none" stroke="#EAA238" stroke-width="3.5"/>
  <line x1="724" y1="208" x2="746" y2="208" stroke="#E8735A" stroke-width="2" marker-end="url(#ahr)"/>
  <rect x="750" y="184" width="170" height="48" rx="10" fill="#141B26" stroke="#E8735A" stroke-width="1.6"/>
  <text x="835" y="204" font-size="11.5" fill="#E8735A" text-anchor="middle" font-weight="700">Exit 2 or 3 · error</text>
  <text x="835" y="222" font-size="10.5" fill="#9FB0C6" text-anchor="middle">the job fails, visibly</text>
  <rect class="hl" style="animation-delay:-2.5s" x="750" y="184" width="170" height="48" rx="10" fill="none" stroke="#E8735A" stroke-width="3.5"/>
  <text x="40" y="262" font-size="12" fill="#9FB0C6">The title carries the version, so raising NEXT_RELEASE opens a fresh issue for the next release.</text>
  <text x="40" y="284" font-size="11" fill="#9FB0C6">Steps and the three possible outcomes light up in turn.</text>
</svg>
