<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Deprecation timeline and the checks that guard it</title>
  <desc id="d">A timeline from deprecated_in through the grace window to remove_in. The policy check reviews the schedule and the message at review time. The expiry check fails once the current version reaches remove_in while the wrapper still exists.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7F99"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6FCF97"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E8735A"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#EAA238"/></marker>
  </defs>
  <rect width="960" height="330" rx="18" fill="#1B2330"/>
  <text x="40" y="44" font-size="22" fill="#F7F9FC" font-weight="700">Two checks, one timeline</text>
  <text x="920" y="44" font-size="13" fill="#EAA238" text-anchor="end">policy reviews the plan · expiry enforces the deadline</text>
  <line x1="60" y1="170" x2="900" y2="170" stroke="#6B7F99" stroke-width="4"/>
  <rect x="190" y="156" width="440" height="28" rx="14" fill="#3A2B10" stroke="#EAA238" stroke-width="2"/>
  <text x="410" y="175" font-size="12" fill="#EAA238" text-anchor="middle" font-weight="600">grace window: callers see the FutureWarning and migrate</text>
  <circle cx="160" cy="170" r="9" fill="#EAA238"/>
  <text x="160" y="126" font-size="14" fill="#F7F9FC" text-anchor="middle" class="mono" font-weight="700">deprecated_in</text>
  <text x="160" y="144" font-size="11.5" fill="#9FB0C6" text-anchor="middle">wrapper ships with a warning</text>
  <circle cx="660" cy="170" r="9" fill="#EAA238"/>
  <text x="660" y="126" font-size="14" fill="#F7F9FC" text-anchor="middle" class="mono" font-weight="700">remove_in</text>
  <text x="660" y="144" font-size="11.5" fill="#9FB0C6" text-anchor="middle">the release that deletes the old API</text>
  <rect x="770" y="132" width="150" height="76" rx="12" fill="#2A1612" stroke="#E8735A" stroke-width="2"/>
  <text x="845" y="156" font-size="12" fill="#E8735A" text-anchor="middle" font-weight="700">still present?</text>
  <text x="845" y="174" font-size="11.5" fill="#F2B8AB" text-anchor="middle">expiry fails the</text>
  <text x="845" y="190" font-size="11.5" fill="#F2B8AB" text-anchor="middle">build</text>
  <line x1="672" y1="170" x2="766" y2="170" stroke="#E8735A" stroke-width="2.5" marker-end="url(#ahr)"/>
  <rect x="60" y="232" width="560" height="70" rx="12" fill="#141B26" stroke="#7FB6E3" stroke-width="1.6"/>
  <text x="80" y="256" font-size="12.5" fill="#7FB6E3" class="mono" font-weight="600">pydeprecate policy · validate_deprecation_policy()</text>
  <text x="80" y="278" font-size="12" fill="#9FB0C6">Reviews the schedule: grace window at least min-grace, a removal</text>
  <text x="80" y="294" font-size="12" fill="#9FB0C6">on a release boundary, a message that names the replacement.</text>
  <line x1="160" y1="232" x2="160" y2="182" stroke="#7FB6E3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="410" y1="232" x2="410" y2="186" stroke="#7FB6E3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="640" y="232" width="280" height="70" rx="12" fill="#141B26" stroke="#E8735A" stroke-width="1.6"/>
  <text x="660" y="256" font-size="12.5" fill="#E8735A" class="mono" font-weight="600">pydeprecate expiry</text>
  <text x="660" y="278" font-size="12" fill="#9FB0C6">Compares the current version with</text>
  <text x="660" y="294" font-size="12" fill="#9FB0C6">remove_in on every wrapper.</text>
  <line x1="660" y1="232" x2="660" y2="182" stroke="#E8735A" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>
