  <rect x="40" y="434" width="880" height="48" rx="12" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <text class="a0" x="480" y="464" font-size="14" text-anchor="middle" fill="#F7F9FC">Today: callers use old_func.</text>
  <text class="a1" x="480" y="464" font-size="14" text-anchor="middle" fill="#F7F9FC">v1.2: write the new API next to it.</text>
  <text class="a2" x="480" y="464" font-size="14" text-anchor="middle" fill="#F7F9FC">v1.2: decorate old_func so it warns and forwards to new_func.</text>
  <text class="a3" x="480" y="464" font-size="14" text-anchor="middle" fill="#F7F9FC">v1.2 → v1.9: callers see the warning and move to new_func.</text>
  <text class="a4" x="480" y="464" font-size="14" text-anchor="middle" fill="#F7F9FC">v2.0: pre-commit, CI and pytest flag old_func as past remove_in.</text>
  <text class="a30" x="480" y="464" font-size="14" text-anchor="middle" fill="#F7F9FC">Delete old_func and its decorator: new_func is the current API, and the cycle repeats.</text>
</svg>
