  <g class="a16"><rect x="772" y="250" width="130" height="46" rx="9" fill="#263246" stroke="#7FB6E3" stroke-width="2"/><text class="mono" x="837.0" y="271" font-size="12" text-anchor="middle" fill="#8DBFE8">new_func</text><text x="837.0" y="287" font-size="10" text-anchor="middle" fill="#9FB0C6">current API</text></g>
