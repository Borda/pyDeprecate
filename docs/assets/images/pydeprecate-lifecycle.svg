<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-labelledby="t d">
  <title id="t">pyDeprecate deprecation lifecycle</title>
  <desc id="d">Four stages. 1: the developer adds the deprecated decorator with target, deprecated_in and remove_in. 2: callers keep working, see a FutureWarning and migrate. 3: pre-commit, CI and pytest checks read the same metadata and fail once the remove_in release is reached. 4: the developer deletes the wrapper and the audit is clean again.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .dim { fill: #9FB0C6; }
    .glow { opacity: 0; }
    .g1 { animation: g1 12s linear infinite; }
    .g2 { animation: g2 12s linear infinite; }
    .g3 { animation: g3 12s linear infinite; }
    .g4 { animation: g4 12s linear infinite; }
    .g1 { animation: g1 12s linear infinite; opacity: 0; }
    .g2 { animation: g2 12s linear infinite; opacity: 0; }
    .g3 { animation: g3 12s linear infinite; opacity: 0; }
    .g4 { animation: g4 12s linear infinite; opacity: 0; }
    .chip { animation: chip 12s linear infinite; opacity: 0; }
    .r1 { animation: r1 12s linear infinite; opacity: 0; }
    .r2 { animation: r2 12s linear infinite; opacity: 0; }
    .r3 { animation: r3 12s linear infinite; opacity: 0; }
    .bad { animation: bad 12s linear infinite; opacity: 0; }
    .del { animation: del 12s linear infinite; opacity: 0; }
    .ok { animation: ok 12s linear infinite; opacity: 0; }
    .run { animation: run 12s linear infinite; }
    .fill { animation: fill 12s linear infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes g1 { 0%, 1% { opacity: 0 } 3%, 23% { opacity: 1 } 25%, 100% { opacity: 0 } }
    @keyframes g2 { 0%, 26% { opacity: 0 } 28%, 48% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes g3 { 0%, 51% { opacity: 0 } 53%, 73% { opacity: 1 } 75%, 100% { opacity: 0 } }
    @keyframes g4 { 0%, 76% { opacity: 0 } 78%, 97% { opacity: 1 } 99%, 100% { opacity: 0 } }
    @keyframes chip { 0%, 28% { opacity: 0 } 30%, 49% { opacity: 1 } 51%, 100% { opacity: 0 } }
    @keyframes r1 { 0%, 52% { opacity: 0 } 54%, 74% { opacity: 1 } 76%, 100% { opacity: 0 } }
    @keyframes r2 { 0%, 56% { opacity: 0 } 58%, 74% { opacity: 1 } 76%, 100% { opacity: 0 } }
    @keyframes r3 { 0%, 60% { opacity: 0 } 62%, 74% { opacity: 1 } 76%, 100% { opacity: 0 } }
    @keyframes bad { 0%, 64% { opacity: 0 } 66%, 74% { opacity: 1 } 76%, 100% { opacity: 0 } }
    @keyframes del { 0%, 77% { opacity: 0 } 79%, 97% { opacity: 1 } 99%, 100% { opacity: 0 } }
    @keyframes ok { 0%, 86% { opacity: 0 } 88%, 97% { opacity: 1 } 99%, 100% { opacity: 0 } }
    @keyframes run { 0%, 25% { transform: translateX(0) } 52%, 98% { transform: translateX(800px) } 100% { transform: translateX(0) } }
    @keyframes fill { 0%, 25% { transform: scaleX(0) } 52%, 98% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .dyn { opacity: 1 !important; }
      .glow { opacity: 0 !important; }
    }
  </style>

  <rect width="960" height="510" rx="18" fill="#1B2330"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#F7F9FC">Deprecation lifecycle</text>
  <text x="330" y="44" font-size="15" fill="#EAA238">from decorator to deletion, enforced by tooling</text>

  <text x="80" y="82" font-size="12" fill="#F7F9FC">v1.2 · ① add</text>
  <text x="480" y="82" font-size="12" text-anchor="middle" fill="#F7F9FC">v1.3 … v1.9 · ② callers migrate</text>
  <text x="880" y="82" font-size="12" text-anchor="end" fill="#F7F9FC">v2.0 · ③ audit fails → ④ delete</text>
  <line x1="80" y1="104" x2="880" y2="104" stroke="#3A4A60" stroke-width="6" stroke-linecap="round"/>
  <rect class="fill" x="80" y="101" width="800" height="6" rx="3" fill="#EAA238"/>
  <circle cx="80" cy="104" r="5" fill="#2E6893" stroke="#7FB6E3" stroke-width="2"/>
  <circle cx="880" cy="104" r="5" fill="#1B2330" stroke="#E8735A" stroke-width="2"/>
  <g class="run"><circle cx="80" cy="104" r="9" fill="#EAA238" stroke="#1B2330" stroke-width="3"/></g>
  <text class="mono" x="80" y="130" font-size="11" fill="#9FB0C6">deprecated_in="1.2"</text>
  <text class="mono" x="880" y="130" font-size="11" text-anchor="end" fill="#9FB0C6">remove_in="2.0"</text>

  <rect x="40" y="156" width="205" height="300" rx="14" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <rect class="glow g1" x="40" y="156" width="205" height="300" rx="14" fill="none" stroke="#EAA238" stroke-width="2.5"/>
  <path d="M252 300 l6 6 l-6 6" fill="none" stroke="#6B7F99" stroke-width="2"/>
  <text x="54" y="184" font-size="14" font-weight="700" fill="#F7F9FC">① Add the decorator</text>
  <text x="54" y="202" font-size="11" class="dim">developer · at v1.2</text>
  <rect x="52" y="214" width="181" height="124" rx="8" fill="#141B26"/>
  <text class="mono" xml:space="preserve" x="62" y="236" font-size="11" fill="#EAA238" text-anchor="start">@deprecated(</text>
  <text class="mono" xml:space="preserve" x="62" y="253" font-size="11" fill="#EAA238" text-anchor="start">  target=new_func,</text>
  <text class="mono" xml:space="preserve" x="62" y="270" font-size="11" fill="#EAA238" text-anchor="start">  deprecated_in=&quot;1.2&quot;,</text>
  <text class="mono" xml:space="preserve" x="62" y="287" font-size="11" fill="#EAA238" text-anchor="start">  remove_in=&quot;2.0&quot;,</text>
  <text class="mono" xml:space="preserve" x="62" y="304" font-size="11" fill="#EAA238" text-anchor="start">)</text>
  <text class="mono" xml:space="preserve" x="62" y="321" font-size="11" fill="#F7F9FC" text-anchor="start">def old_func(x): ...</text>
  <text xml:space="preserve" x="54" y="362" font-size="11" fill="#9FB0C6" text-anchor="start">Target, deadline and message</text>
  <text xml:space="preserve" x="54" y="378" font-size="11" fill="#9FB0C6" text-anchor="start">live in one place.</text>
  <rect x="265" y="156" width="205" height="300" rx="14" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <rect class="glow g2" x="265" y="156" width="205" height="300" rx="14" fill="none" stroke="#EAA238" stroke-width="2.5"/>
  <path d="M477 300 l6 6 l-6 6" fill="none" stroke="#6B7F99" stroke-width="2"/>
  <text x="279" y="184" font-size="14" font-weight="700" fill="#F7F9FC">② Callers migrate</text>
  <text x="279" y="202" font-size="11" class="dim">users · v1.2 → v1.9</text>
  <rect x="277" y="214" width="181" height="36" rx="8" fill="#263246" stroke="#3A4A60"/>
  <text class="mono" xml:space="preserve" x="367.5" y="237" font-size="13" fill="#F7F9FC" text-anchor="middle">old_func(3)</text>
  <g class="dyn chip"><rect x="277" y="262" width="181" height="52" rx="8" fill="#3A2B10" stroke="#EAA238"/>
  <text xml:space="preserve" x="287" y="280" font-size="11" fill="#EAA238" text-anchor="start" font-weight="700">⚠ FutureWarning</text>
  <text class="mono" xml:space="preserve" x="287" y="295" font-size="10" fill="#F5D9A6" text-anchor="start">old_func deprecated v1.2,</text>
  <text class="mono" xml:space="preserve" x="287" y="308" font-size="10" fill="#F5D9A6" text-anchor="start">use new_func, gone in v2.0</text></g>
  <text class="mono" xml:space="preserve" x="279" y="342" font-size="11" fill="#6FCF97" text-anchor="start">→ returns 4, nothing breaks</text>
  <text xml:space="preserve" x="279" y="370" font-size="11" fill="#9FB0C6" text-anchor="start">Callers see the replacement</text>
  <text xml:space="preserve" x="279" y="386" font-size="11" fill="#9FB0C6" text-anchor="start">and the deadline, and migrate</text>
  <text xml:space="preserve" x="279" y="402" font-size="11" fill="#9FB0C6" text-anchor="start">at their own pace.</text>
  <rect x="490" y="156" width="205" height="300" rx="14" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <rect class="glow g3" x="490" y="156" width="205" height="300" rx="14" fill="none" stroke="#EAA238" stroke-width="2.5"/>
  <path d="M702 300 l6 6 l-6 6" fill="none" stroke="#6B7F99" stroke-width="2"/>
  <text x="504" y="184" font-size="14" font-weight="700" fill="#F7F9FC">③ Tooling watches</text>
  <text x="504" y="202" font-size="11" class="dim">automated · every change</text>
  <rect x="502" y="214" width="181" height="54" rx="8" fill="#263246" stroke="#3A4A60"/>
  <rect class="dyn r1" x="502" y="214" width="181" height="54" rx="8" fill="none" stroke="#7FB6E3" stroke-width="2"/>
  <text xml:space="preserve" x="514" y="235" font-size="12" fill="#7FB6E3" text-anchor="start" font-weight="700">pre-commit</text>
  <text class="mono" xml:space="preserve" x="514" y="254" font-size="9.5" fill="#F7F9FC" text-anchor="start">hook: pydeprecate-expiry</text>
  <rect x="502" y="278" width="181" height="54" rx="8" fill="#263246" stroke="#3A4A60"/>
  <rect class="dyn r2" x="502" y="278" width="181" height="54" rx="8" fill="none" stroke="#7FB6E3" stroke-width="2"/>
  <text xml:space="preserve" x="514" y="299" font-size="12" fill="#7FB6E3" text-anchor="start" font-weight="700">CI</text>
  <text class="mono" xml:space="preserve" x="514" y="318" font-size="9.5" fill="#F7F9FC" text-anchor="start">Borda/pyDeprecate@v0.15.0</text>
  <rect x="502" y="342" width="181" height="54" rx="8" fill="#263246" stroke="#3A4A60"/>
  <rect class="dyn r3" x="502" y="342" width="181" height="54" rx="8" fill="none" stroke="#7FB6E3" stroke-width="2"/>
  <text xml:space="preserve" x="514" y="363" font-size="12" fill="#7FB6E3" text-anchor="start" font-weight="700">pytest</text>
  <text class="mono" xml:space="preserve" x="514" y="382" font-size="9.5" fill="#F7F9FC" text-anchor="start">validate_deprecation_expiry()</text>
  <g class="dyn bad"><rect x="502" y="406" width="181" height="34" rx="8" fill="#3B1D1A" stroke="#E8735A"/>
  <text class="mono" xml:space="preserve" x="592.5" y="427" font-size="9.5" fill="#F2A394" text-anchor="middle">✗ old_func past remove_in=2.0</text></g>
  <rect x="715" y="156" width="205" height="300" rx="14" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
  <rect class="glow g4" x="715" y="156" width="205" height="300" rx="14" fill="none" stroke="#EAA238" stroke-width="2.5"/>

  <text x="729" y="184" font-size="14" font-weight="700" fill="#F7F9FC">④ Delete the wrapper</text>
  <text x="729" y="202" font-size="11" class="dim">developer · at v2.0</text>
  <rect x="727" y="214" width="181" height="80" rx="8" fill="#141B26"/>
  <g class="dyn del"><text class="mono" xml:space="preserve" x="737" y="236" font-size="11" fill="#F2A394" text-anchor="start">- @deprecated(…)</text>
  <text class="mono" xml:space="preserve" x="737" y="254" font-size="11" fill="#F2A394" text-anchor="start">- def old_func(x): ...</text></g>
  <text class="mono" xml:space="preserve" x="737" y="272" font-size="11" fill="#9FB0C6" text-anchor="start">  def new_func(x): ...</text>
  <g class="dyn ok"><rect x="727" y="312" width="181" height="34" rx="8" fill="#16301F" stroke="#6FCF97"/>
  <text class="mono" xml:space="preserve" x="817.5" y="333" font-size="10.5" fill="#9BE3B5" text-anchor="middle">✓ pydeprecate all: clean</text></g>
  <text xml:space="preserve" x="729" y="370" font-size="11" fill="#9FB0C6" text-anchor="start">Exit code 0 again,</text>
  <text xml:space="preserve" x="729" y="386" font-size="11" fill="#9FB0C6" text-anchor="start">safe to merge.</text>

  <text x="480" y="486" font-size="12" text-anchor="middle" class="dim">pre-commit, CI and pytest read the same remove_in metadata: no separate deadline list to keep in sync.</text>
</svg>
