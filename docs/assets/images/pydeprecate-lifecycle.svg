  <g class="a24"><rect x="610" y="316" width="260" height="46" rx="9" fill="#3A2B10" stroke="#EAA238"/><text x="624" y="334" font-size="10.5" font-weight="700" fill="#EAA238">⚠ FutureWarning</text><text class="mono" x="624" y="351" font-size="10" fill="#F5D9A6">old_func deprecated v1.2, use new_func</text></g>
  <g class="a25"><rect x="580" y="310" width="320" height="22" rx="7" fill="#263246" stroke="#7FB6E3" stroke-width="1.5"/><text x="592" y="325" font-size="11" font-weight="700" fill="#7FB6E3">pre-commit</text><text class="mono" x="672" y="325" font-size="10" fill="#F7F9FC">pydeprecate-expiry</text></g>
  <g class="a26"><rect x="580" y="336" width="320" height="22" rx="7" fill="#263246" stroke="#7FB6E3" stroke-width="1.5"/><text x="592" y="351" font-size="11" font-weight="700" fill="#7FB6E3">CI</text><text class="mono" x="672" y="351" font-size="10" fill="#F7F9FC">Borda/pyDeprecate@v0.15.0</text></g>
  <g class="a27"><rect x="580" y="362" width="320" height="22" rx="7" fill="#263246" stroke="#7FB6E3" stroke-width="1.5"/><text x="592" y="377" font-size="11" font-weight="700" fill="#7FB6E3">pytest</text><text class="mono" x="672" y="377" font-size="10" fill="#F7F9FC">validate_deprecation_expiry()</text></g>
