<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" width="960" height="504" role="img" aria-labelledby="t d">
  <title id="t">pyDeprecate deprecation lifecycle</title>
  <desc id="d">Six steps in a repeating cycle. 1: the old API, shown in blue. 2: the new API is added, shown in gold. 3: the deprecated decorator, also gold, is added above the old code so it warns and forwards to the new API. 4: callers see the warning and migrate. 5: pre-commit, CI and pytest checks flag the old API once remove_in is reached. 6: the old API and decorator are deleted, the new API becomes the current API in blue, and the cycle repeats.</desc>
