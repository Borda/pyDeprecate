  <text class="ln mono a6" xml:space="preserve" x="64" y="192" font-size="13" textLength="249.6" lengthAdjust="spacing"><tspan fill="#F2B95A">def new_func(value: int) -&gt; int:</tspan></text>
  <text class="ln mono a7" xml:space="preserve" x="64" y="214" font-size="13" textLength="156.0" lengthAdjust="spacing"><tspan fill="#F2B95A">    return value + 1</tspan></text>
  <text class="ln mono a8" xml:space="preserve" x="64" y="258" font-size="13" textLength="93.6" lengthAdjust="spacing"><tspan fill="#F2B95A">@deprecated(</tspan></text>
  <text class="ln mono a9" xml:space="preserve" x="64" y="280" font-size="13" textLength="156.0" lengthAdjust="spacing"><tspan fill="#F2B95A">    target=new_func,</tspan></text>
  <text class="ln mono a10" xml:space="preserve" x="64" y="302" font-size="13" textLength="187.2" lengthAdjust="spacing"><tspan fill="#F2B95A">    deprecated_in="1.2",</tspan></text>
  <text class="ln mono a11" xml:space="preserve" x="64" y="324" font-size="13" textLength="156.0" lengthAdjust="spacing"><tspan fill="#F2B95A">    remove_in="2.0",</tspan></text>
  <text class="ln mono a12" xml:space="preserve" x="64" y="346" font-size="13" textLength="7.8" lengthAdjust="spacing"><tspan fill="#F2B95A">)</tspan></text>
  <text class="ln mono a13" xml:space="preserve" x="64" y="368" font-size="13" textLength="249.6" lengthAdjust="spacing"><tspan fill="#8DBFE8">def old_func(value: int) -&gt; int:</tspan></text>
  <text class="ln mono a14 gone" xml:space="preserve" x="64" y="390" font-size="13" textLength="156.0" lengthAdjust="spacing"><tspan fill="#8DBFE8">    return value + 1</tspan></text>
  <text class="ln mono a15" xml:space="preserve" x="64" y="390" font-size="13" textLength="210.6" lengthAdjust="spacing"><tspan fill="#8DBFE8">    pass  </tspan><tspan fill="#6B7F99" font-style="italic"># body never runs</tspan></text>
  <text class="ln mono a16 gone" xml:space="preserve" x="64" y="192" font-size="13" textLength="249.6" lengthAdjust="spacing"><tspan fill="#8DBFE8">def new_func(value: int) -&gt; int:</tspan></text>
  <text class="ln mono a17 gone" xml:space="preserve" x="64" y="214" font-size="13" textLength="156.0" lengthAdjust="spacing"><tspan fill="#8DBFE8">    return value + 1</tspan></text>
