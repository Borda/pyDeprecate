    <text x="524" y="368" font-size="10" text-anchor="end" fill="#E8735A">old API + decorator deleted</text>
  </g>
  <text x="520" y="408" font-size="10" text-anchor="end" fill="#9FB0C6" xml:space="preserve"><tspan fill="#7FB6E3">■</tspan> old API    <tspan fill="#EAA238">■</tspan> new API / decorator</text>
  <rect x="560" y="138" width="360" height="280" rx="14" fill="#1F2938" stroke="#2E3B50" stroke-width="1.5"/>
