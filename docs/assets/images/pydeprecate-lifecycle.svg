  <rect x="640" y="174" width="200" height="40" rx="9" fill="#263246" stroke="#3A4A60" stroke-width="1.5"/>
  <text class="mono a19" x="740" y="192" font-size="12" text-anchor="middle" fill="#8DBFE8">old_func(3)</text>
  <text class="mono a20" x="740" y="192" font-size="12" text-anchor="middle" fill="#F2B95A">new_func(3)</text>
  <text x="740" y="206" font-size="10" text-anchor="middle" fill="#9FB0C6">caller · user code</text>
