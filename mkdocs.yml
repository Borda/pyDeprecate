site_name: pyDeprecate — Python Deprecation Library
site_description: >-
  Python deprecation decorator library for API migration: automatic call forwarding,
  argument renaming, class and instance deprecation, warning control, and CI audit
  checks for removal deadlines. Zero runtime dependencies.
site_url: https://borda.github.io/pyDeprecate/
repo_url: https://github.com/Borda/pyDeprecate
repo_name: Borda/pyDeprecate
edit_uri: ""
docs_dir: docs
use_directory_urls: false
copyright: Copyright &copy; 2020&ndash;2026 Jiri Borovec

hooks:
  - docs/mkdocs_hooks.py

exclude_docs: |
  overrides/
  guide/_deltas/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  favicon: assets/brand/favicon.svg
  logo: assets/brand/mark.svg

plugins:
  - search
  # Every moved or renamed page needs an entry here (old path -> new path) so old links and bookmarks keep working.
  - redirects:
      redirect_maps:
        guide/audit.md: guide/audit/index.md
        guide/audit-policy.md: guide/audit/policy.md
        guide/ci-integration.md: guide/audit/ci-integration.md
        guide/cli.md: guide/audit/cli.md
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_date
      fallback_to_build_date: true
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            extensions:
              - deprecate.docstring.griffe_ext:RuntimeDocstrings
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

extra:
  version:
    provider: mike
    default: stable
  # A section that moved to another page: old anchor -> page now holding it. main.html follows it when the anchor is missing.
  anchor_moves:
    enforcing-removal-deadlines: guide/audit/policy.html
    pytest-integration-for-expiry-enforcement: guide/audit/policy.html
    enforcing-a-deprecation-policy: guide/audit/policy.html
    the-two-rules: guide/audit/policy.html
    scanning-a-package: guide/audit/policy.html
    pytest-integration: guide/audit/ci-integration.html
    enforcing-the-policy-in-ci: guide/audit/ci-integration.html
    monorepo-several-packages-in-one-run: guide/audit/ci-integration.html
    pre-commit-integration: guide/audit/ci-integration.html
    github-action: guide/audit/ci-integration.html
    testing-deprecated-code: guide/testing.html
    suppressing-warnings-in-test-fixtures: guide/testing.html
    choosing-the-right-testing-tool: guide/testing.html
    selective-attribute-deprecation: guide/attributes.html
    decorator-syntax-attribute-rename: guide/attributes.html
    reads-writes-and-deletes-all-redirect: guide/attributes.html
    warn-only-with-none-redirect: guide/attributes.html
    per-attribute-independent-warning-budgets: guide/attributes.html
    enum-deprecated-member-aliases: guide/attributes.html
    explicit-targetmodeattrs_remap-form: guide/attributes.html
    callable-target-with-attribute-redirection: guide/attributes.html
    dataclass-field-renames: guide/attributes.html
    class-type-compatibility: guide/attributes.html
    combining-attribute-and-argument-deprecation: guide/attributes.html
    mixed-redirect-and-warn-only-entries: guide/attributes.html
    stacking-deprecated_class-for-multi-version-deprecations: guide/attributes.html
    chained-redirect: guide/attributes.html
    nested-proxy-wrappers: guide/attributes.html
    real-world-migration-ml-training-config: guide/attributes.html

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - meta
  - toc:
      permalink: "🔗"
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: ignore

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Use Cases:
      - Overview: guide/use-cases.md
      - Lifecycle: guide/lifecycle.md
      - Functions: guide/functions.md
      - Classes: guide/classes.md
      - Attributes: guide/attributes.md
      - Modules: guide/modules.md
      - Properties: guide/properties.md
      - Async: guide/async.md
      - Advanced: guide/advanced.md
  - Audit and CI:
      - Audit Tools: guide/audit/index.md
      - Audit Policy: guide/audit/policy.md
      - CI Integration: guide/audit/ci-integration.md
      - CLI: guide/audit/cli.md
  - Tools:
      - Testing: guide/testing.md
      - void() Helper: guide/void-helper.md
      - Docs Integration: guide/docs-integration.md
  - Configuration:
      - Customization: guide/customization.md
      - Migration Guide: guide/migration.md
  - Adoption:
      - Compare Python Deprecation Tools: guide/compare-python-deprecation-tools.md
      - Agent Recipes: guide/agent-recipes.md
  - API Reference: api-reference.md
  - Troubleshooting: troubleshooting.md
  - Limitations: limitations.md
  - Brand: brand.md
  - Changelog: changelog.md
  - Demos:
      - Sphinx: demo-sphinx/index.html
      - MkDocs: demo-mkdocs/index.html
